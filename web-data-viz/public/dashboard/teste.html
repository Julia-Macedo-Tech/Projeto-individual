<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <a href="javascript:newPopup()">Abrir popup</a>

    <button onclick="meuPopup.showModal()">Abrir Janela</button>

    <!-- O "Popup" Customizado -->
    <dialog id="meuPopup" style="width: 250px; height: 250px; resize: none; border: 1px solid #ccc; padding: 20px;">
        <p>Aqui você põe o que quiser.</p>

        <!-- Você precisa criar seu próprio botão para fechar se quiser um -->
        <button onclick="meuPopup.close()">Fechar</button>
    </dialog>

</body>

</html>

<head>
    <script type="text/javascript">
        function newPopup() {
            varWindow = window.open(
                'popup.html',
                'pagina',
                "width=350, height=255, top=100, left=110, scrollbars=no, resizable=no");
        }
    </script>
</head>
