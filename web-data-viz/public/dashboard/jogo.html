    function carta(escolha) {

        } else if (numero_cartas == 1) {
            numero_cartas++;
            document.getElementById(escolha).classList.add("escolha")
            carta2 = escolha;

            carta1_maquina = carta2_maquina;
            carta2_maquina = troca;
            troca = carta1_maquina_vida;

            carta2_maquina_vida = troca;
            troca = carta1_maquina_ataque;
            carta1_maquina_ataque = carta2_maquina_ataque;
            carta2_maquina_ataque = troca;
        }

        barra_vida_maquina.value = carta1_maquina_vida;
        barra_vida_maquina.max = cartas[carta1_maquina]["vida"];

        vida_usuario_nome.innerHTML = `<p>${escolhida}</p>`;

            </div>`;

        carta2 = trocada;
        carta1 = escolhida;
    }

            document.getElementById(carta2).classList.remove("escolha")

        numero_cartas = 0;
