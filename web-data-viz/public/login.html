<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="js/sessao.js"></script>

</head>

<body>

    <div>
        <div>
            <p>Nome de usuário:</p>
            <input type="text" id="inp_nome">

            <p>Senha:</p>
            <input type="text" id="inp_senha">

            <button onclick="entrar()">Entrar</button>
            <button><a href="cadastro.html">Não tem cadastro ainda? Cadastre-se</a></button>

            <div id="mensagem_erro"></div>

            <div id="div_erros_login"></div>

            <div id="div_aguardar"></div>

            <div id="cardErro"></div>
        </div>
    </div>

</body>

</html>

<script>
    function entrar() {
        aguardar();

        var nomeVar = inp_nome.value;
        var senhaVar = inp_senha.value;

        if (nomeVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", nomeVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")
            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id

                    setTimeout(function () {
                        window.location = "./dashboard/principal.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
</script>
