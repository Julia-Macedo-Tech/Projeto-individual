<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <script src="js/sessao.js"></script>
  <link rel="stylesheet" href="style/login.css">
  <script src="js/sessao.js"></script>
  <link rel="icon" href="assets/icon/icon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>

<body>

  <div class="container-amarelo">

    <img src="assets/icon/icon.png" alt="">
    <h1>Bazinga!</h1>

  </div>

  <div class="container-azul">
    <div>
      <p class="titulo">Cadastrar-se</p>
            <span>Faça o cadastro para ter acesso a muito mais!</span>

      <p>Nome de usuário:</p>
      <input type="text" id="inp_nome">

      <p>Senha:</p>
      <input type="password" id="inp_senha">

      <p>Confirmar senha:</p>
      <input type="password" id="inp_confirmar">
      
      <div>
        <button onclick="cadastrar()" class="entrar">Cadastrar-se</button>
      </div>

      <div id="mensagem_erro"></div>

      <div id="div_erros_login"></div>

      <div id="div_aguardar"></div>

      <div id="cardErro"></div>
    </div>
  </div>

</body>

</html>

<script>
  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = inp_nome.value;
    var senhaVar = inp_senha.value;
    var confirmacaoSenhaVar = inp_confirmar.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Erro. Não pode haver campos em branco)";

      finalizarAguardar();
      return false;

    } else if (nomeVar.length <= 1) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Erro no nome. Nome deve ter mais de 1 caracter)";

      finalizarAguardar();
      return false;

    } else if (senhaVar.length <= 6) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Erro na senha. Senha deve ter mais de 6 caracteres)";

      finalizarAguardar();
      return false;

    } else if (confirmacaoSenhaVar != senhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Erro na confirmação da senha. A confirmação da senha deve ser igual a senha)";

      finalizarAguardar();
      return false;

    } else {
      setInterval(sumirMensagem, 5000);
    }


    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
